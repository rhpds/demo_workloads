---
- name: Create classic MTV workload namespaces on each target cluster
  ansible.builtin.include_tasks: namespaces.yml
  loop: "{{ cclm_target_clusters }}"
  loop_control:
    loop_var: cclm_cluster_name
    label: "{{ cclm_cluster_name }}"

- name: Create lab VM namespaces on each target cluster
  ansible.builtin.include_tasks: lab_namespaces.yml
  loop: "{{ cclm_target_clusters }}"
  loop_control:
    loop_var: cclm_cluster_name
    label: "{{ cclm_cluster_name }}"

- name: Seed lab VirtualMachines on source cluster
  ansible.builtin.include_tasks: seed_vm.yml
  loop: "{{ cclm_seed_vms }}"
  loop_control:
    loop_var: cclm_seed_vm
    label: "{{ cclm_seed_vm.namespace }}/{{ cclm_seed_vm.name }}"
  when: cclm_seed_vm_run | bool
