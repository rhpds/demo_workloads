---
- name: Resolve Troshka project Ceph source secret
  ansible.builtin.set_fact:
    cclm_project_ceph_src_secret: >-
      {{ secretName | default(troshka_project_ceph_secret | default('troshka-ceph-external')) }}
    cclm_project_ceph_pool: "{{ poolName | default('troshka-ceph-pool') }}"

- name: Wait for exported external_cluster_details on workload mount
  ansible.builtin.wait_for:
    path: "{{ cclm_project_ceph_mount_path }}/external_cluster_details"
    timeout: "{{ cclm_ceph_export_wait_timeout }}"
  register: cclm_export_wait
  failed_when: false

- name: Read exported external_cluster_details from mounted project Ceph secret
  ansible.builtin.slurp:
    src: "{{ cclm_project_ceph_mount_path }}/external_cluster_details"
  register: cclm_mounted_external_details
  when: cclm_export_wait is succeeded

- name: Read project Ceph secret from host cluster when mount is unavailable
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ cclm_project_ceph_src_secret }}"
    namespace: "{{ secretNamespace }}"
  register: cclm_host_ceph_secret
  when:
    - secretNamespace | default('') | length > 0
    - cclm_export_wait is failed

- name: Select ODF external_cluster_details blob
  ansible.builtin.set_fact:
    cclm_external_cluster_details: >-
      {{
        (cclm_mounted_external_details.content | b64decode)
        if (cclm_mounted_external_details is not skipped
            and (cclm_mounted_external_details.content | default('') | length) > 0)
        else (
          cclm_host_ceph_secret.resources[0].data.external_cluster_details | b64decode
          if (cclm_host_ceph_secret is not skipped
              and (cclm_host_ceph_secret.resources | default([]) | length) > 0
              and cclm_host_ceph_secret.resources[0].data.external_cluster_details is defined)
          else ''
        )
      }}

- name: Fail when project Ceph export is not ready
  ansible.builtin.fail:
    msg: >-
      Troshka project Ceph export is not ready (missing external_cluster_details).
      Wait for TroshkaCeph phase Ready, then re-run this workload.
  when: cclm_external_cluster_details | default('') | length == 0

- name: Create ODF external cluster details secret on {{ cclm_cluster_name }}
  kubernetes.core.k8s:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ cclm_ceph_secret_name }}"
        namespace: "{{ cclm_ceph_secret_namespace }}"
      type: Opaque
      data:
        external_cluster_details: "{{ cclm_external_cluster_details | b64encode }}"
