---
- name: Copy Troshka project Ceph credentials into nested openshift-storage
  ansible.builtin.include_tasks: copy_external_ceph_secret.yml

- name: Ensure openshift-storage namespace exists
  kubernetes.core.k8s:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-storage

- name: Create external StorageCluster on {{ cclm_cluster_name }}
  kubernetes.core.k8s:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: ocs.openshift.io/v1
      kind: StorageCluster
      metadata:
        name: "{{ cclm_storage_cluster_name }}"
        namespace: openshift-storage
      spec:
        externalStorage:
          enable: true
        storageDeviceSets: []

- name: Wait for external StorageCluster to be ready on {{ cclm_cluster_name }}
  kubernetes.core.k8s_info:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    name: "{{ cclm_storage_cluster_name }}"
    namespace: openshift-storage
  register: cclm_storage_cluster
  retries: 60
  delay: 20
  until:
    - cclm_storage_cluster.resources is defined
    - cclm_storage_cluster.resources | length > 0
    - cclm_storage_cluster.resources[0].status.phase | default('') == "Ready"
