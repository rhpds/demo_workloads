---
- name: Set source cluster API context
  ansible.builtin.include_role:
    name: troshka_workload_cclm_common
    tasks_from: set_cluster_context.yml
  vars:
    cclm_cluster_name: "{{ cclm_source_cluster }}"

- name: Create Forklift provider secret for destination on source cluster
  kubernetes.core.k8s:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ cclm_dest_cluster }}-forklift"
        namespace: "{{ cclm_forklift_namespace }}"
        labels:
          createdForResourceType: providers
          createdForResource: "{{ cclm_dest_cluster }}"
      type: Opaque
      stringData:
        url: "{{ clusters[cclm_dest_cluster].api_url }}"
        token: "{{ clusters[cclm_dest_cluster].api_token }}"
        insecure: "true"

- name: Register destination provider on source cluster
  kubernetes.core.k8s:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: forklift.konveyor.io/v1beta1
      kind: Provider
      metadata:
        name: "{{ cclm_dest_cluster }}"
        namespace: "{{ cclm_forklift_namespace }}"
      spec:
        type: "{{ cclm_forklift_provider_type }}"
        url: "{{ clusters[cclm_dest_cluster].api_url }}"
        secret:
          name: "{{ cclm_dest_cluster }}-forklift"
          namespace: "{{ cclm_forklift_namespace }}"

- name: Create pod-to-pod NetworkMap on source cluster
  kubernetes.core.k8s:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: forklift.konveyor.io/v1beta1
      kind: NetworkMap
      metadata:
        name: "{{ cclm_forklift_network_map_name }}"
        namespace: "{{ cclm_forklift_namespace }}"
      spec:
        provider:
          destination:
            name: "{{ cclm_dest_cluster }}"
            namespace: "{{ cclm_forklift_namespace }}"
          source:
            name: host
            namespace: "{{ cclm_forklift_namespace }}"
        map:
          - source:
              type: pod
            destination:
              type: pod

- name: Create StorageMap (source ODF RBD → dest storage class) on source cluster
  kubernetes.core.k8s:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: forklift.konveyor.io/v1beta1
      kind: StorageMap
      metadata:
        name: "{{ cclm_forklift_storage_map_name }}"
        namespace: "{{ cclm_forklift_namespace }}"
      spec:
        provider:
          destination:
            name: "{{ cclm_dest_cluster }}"
            namespace: "{{ cclm_forklift_namespace }}"
          source:
            name: host
            namespace: "{{ cclm_forklift_namespace }}"
        map:
          - source:
              name: "{{ cclm_odf_storage_class }}"
            destination:
              storageClass: "{{ cclm_dest_storage_class }}"
