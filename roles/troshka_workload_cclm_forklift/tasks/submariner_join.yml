---
- name: Set cluster API context
  ansible.builtin.include_role:
    name: troshka_workload_cclm_common
    tasks_from: set_cluster_context.yml

- name: Resolve Submariner broker API for {{ cclm_cluster_name }}
  ansible.builtin.set_fact:
    cclm_submariner_broker_api: >-
      {{
        (clusters[cclm_source_cluster].api_url if not cclm_submariner_broker_cluster | bool else cclm_k8s_host)
        | regex_replace('^https?://', '')
      }}
    cclm_submariner_broker_token: >-
      {{
        clusters[cclm_source_cluster].api_token
        if not cclm_submariner_broker_cluster | bool
        else cclm_k8s_token
      }}
  when: clusters is defined

# Prefer an explicit CA when provided; otherwise join with brokerK8sInsecure
# (RHDP CCLM reference used insecure=true on the shared L2 lab).
- name: Resolve Submariner broker CA for {{ cclm_cluster_name }}
  ansible.builtin.set_fact:
    cclm_submariner_broker_ca_effective: "{{ cclm_submariner_broker_ca | default('') }}"
    cclm_submariner_broker_insecure: >-
      {{
        (cclm_submariner_broker_ca | default('') | length == 0)
        | bool
      }}

# CRD requires clusterID/clusterCIDR/serviceCIDR/ceIPSecDebug/namespace/brokerK8sRemoteNamespace
# (clusterId/clusterCidr variants are rejected with 422).
- name: Join Submariner on {{ cclm_cluster_name }}
  kubernetes.core.k8s:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: submariner.io/v1alpha1
      kind: Submariner
      metadata:
        name: submariner
        namespace: "{{ cclm_submariner_broker_namespace }}"
      spec:
        broker: k8s
        brokerK8sApiServer: "{{ cclm_submariner_broker_api | default(cclm_k8s_host) | regex_replace('^https?://', '') }}"
        brokerK8sApiServerToken: "{{ cclm_submariner_broker_token | default(cclm_k8s_token) }}"
        brokerK8sCA: "{{ cclm_submariner_broker_ca_effective }}"
        brokerK8sInsecure: "{{ cclm_submariner_broker_insecure }}"
        brokerK8sRemoteNamespace: "{{ cclm_submariner_broker_remote_namespace | default('submariner-k8s-broker') }}"
        cableDriver: wireguard
        ceIPSecDebug: false
        clusterID: "{{ cclm_cluster_name }}"
        clusterCIDR: "{{ cclm_submariner_cluster_cidr | default('10.128.0.0/14') }}"
        serviceCIDR: "{{ cclm_submariner_service_cidr | default('172.30.0.0/16') }}"
        namespace: "{{ cclm_submariner_broker_namespace }}"
        natEnabled: true
        debug: false
        globalCIDR: ""
        loadBalancerEnabled: true
        serviceDiscoveryEnabled: true
