---
# Builds a list of clusters NOT already registered in ArgoCD,
# each with an api_url and token. If a cluster's kubeconfig
# has no token, logs in with client-certificate credentials
# to obtain one.
#
# Inputs:
#   _ocp4_workload_gitops_add_cluster_cluster_info  (list from add_cluster_from_kubeconfig.yml)
#   _ocp4_workload_gitops_add_cluster_existing_clusters  (list from workload.yml)
#
# Output:
#   ocp4_workload_gitops_add_cluster_new_clusters
#     - list of dicts: { name, api_url, token }

- name: Filter clusters not already in ArgoCD
  ansible.builtin.set_fact:
    _ocp4_workload_gitops_add_cluster_new_clusters_raw: >-
      {{ _ocp4_workload_gitops_add_cluster_cluster_info
         | rejectattr('server', 'in', _ocp4_workload_gitops_add_cluster_existing_clusters)
         | list }}

- name: Report clusters not in ArgoCD
  ansible.builtin.debug:
    msg: "Clusters to add: {{ _ocp4_workload_gitops_add_cluster_new_clusters_raw | map(attribute='name') | list }}"

- name: Initialize new clusters credential list
  ansible.builtin.set_fact:
    ocp4_workload_gitops_add_cluster_new_clusters: []

- name: Collect credentials for each new cluster
  ansible.builtin.include_tasks: resolve_cluster_token.yml
  loop: "{{ _ocp4_workload_gitops_add_cluster_new_clusters_raw }}"
  loop_control:
    loop_var: _cluster
    label: "{{ _cluster.name }} -> {{ _cluster.server }}"

- name: Verify tokens by logging into each cluster
  ansible.builtin.uri:
    url: "{{ item.api_url }}/apis"
    method: GET
    headers:
      Authorization: "Bearer {{ item.token }}"
    validate_certs: "{{ not (ocp4_workload_gitops_add_cluster_cluster_insecure | bool) }}"
    status_code: 200
  loop: "{{ ocp4_workload_gitops_add_cluster_new_clusters }}"
  loop_control:
    label: "{{ item.name }}"
  register: _ocp4_workload_gitops_add_cluster_token_tests

- name: Output cluster credentials via agnosticd_user_info
  agnosticd.core.agnosticd_user_info:
    data:
      "{{ item.name }}_api_url": "{{ item.api_url }}"
      "{{ item.name }}_api_token": "{{ item.token }}"
  loop: "{{ ocp4_workload_gitops_add_cluster_new_clusters }}"
  loop_control:
    label: "{{ item.name }}"
