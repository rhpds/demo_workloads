---
# Builds a credential list for all discovered clusters.
# Each entry has an api_url and token. If a cluster's kubeconfig
# has no token, logs in with client-certificate credentials
# to obtain one.
#
# Input:
#   _ocp4_workload_gitops_add_cluster_all_cluster_info  (cumulative list from add_cluster_from_kubeconfig.yml)
#
# Output:
#   ocp4_workload_gitops_add_cluster_new_clusters
#     - dict keyed by cluster name, each value: { api_url, token }

- name: Initialize cluster credential dict
  ansible.builtin.set_fact:
    ocp4_workload_gitops_add_cluster_new_clusters: {}

- name: Collect credentials for each cluster
  ansible.builtin.include_tasks: resolve_cluster_token.yml
  loop: "{{ _ocp4_workload_gitops_add_cluster_all_cluster_info }}"
  loop_control:
    loop_var: _cluster
    label: "{{ _cluster.name }} -> {{ _cluster.server }}"

- name: Verify tokens by logging into each cluster
  ansible.builtin.uri:
    url: "{{ item.value.api_url }}/apis"
    method: GET
    headers:
      Authorization: "Bearer {{ item.value.token }}"
    validate_certs: "{{ not (ocp4_workload_gitops_add_cluster_cluster_insecure | bool) }}"
    status_code: 200
  loop: "{{ ocp4_workload_gitops_add_cluster_new_clusters | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _ocp4_workload_gitops_add_cluster_token_tests

- name: Output cluster credentials via agnosticd_user_info
  agnosticd.core.agnosticd_user_info:
    data: "{{ { item.key ~ '_api_url': item.value.api_url, item.key ~ '_api_token': item.value.token } }}"
  loop: "{{ ocp4_workload_gitops_add_cluster_new_clusters | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
