---
- name: Remove unwanted GNOME packages
  ansible.builtin.dnf:
    name:
      - gnome-initial-setup
      - gnome-software
      - gnome-tour
      - subscription-manager-cockpit
    state: absent
  ignore_errors: true

- name: Disable subscription manager daemon
  ansible.builtin.systemd:
    name: rhsmcertd
    state: stopped
    enabled: false
    masked: true
  ignore_errors: true

- name: Check if gsd-subman service exists
  ansible.builtin.stat:
    path: /lib/systemd/user/org.gnome.SettingsDaemon.Subscription.service
  register: _gsd_subman

- name: Disable gsd-subman
  when: _gsd_subman.stat.exists
  ansible.builtin.lineinfile:
    path: /lib/systemd/user/org.gnome.SettingsDaemon.Subscription.service
    regexp: "^ExecStart=.*gsd-subman"
    line: "#ExecStart=/usr/libexec/gsd-subman"

- name: Create .config directories
  ansible.builtin.file:
    path: "{{ item.path }}/.config/dconf"
    state: directory
    owner: "{{ item.owner }}"
    mode: "0755"
    recurse: true
  loop:
    - { path: /etc/skel, owner: root }
    - { path: "/home/{{ bastion_desktop_user }}", owner: "{{ bastion_desktop_user }}" }
    - { path: /root, owner: root }

- name: Create gdm .config directory
  ansible.builtin.file:
    path: /var/lib/gdm/.config/dconf
    state: directory
    owner: gdm
    mode: "0755"
    recurse: true
  ignore_errors: true

- name: Mark initial setup as done
  ansible.builtin.copy:
    content: "yes"
    dest: "{{ item.path }}/.config/gnome-initial-setup-done"
    owner: "{{ item.owner }}"
    mode: "0644"
  loop:
    - { path: /etc/skel, owner: root }
    - { path: "/home/{{ bastion_desktop_user }}", owner: "{{ bastion_desktop_user }}" }
    - { path: /root, owner: root }

- name: Gather package facts for terminal detection
  ansible.builtin.package_facts:
    manager: rpm

- name: Set terminal app
  ansible.builtin.set_fact:
    _term_app: "{{ 'org.gnome.Ptyxis.desktop' if 'ptyxis' in ansible_facts.packages else 'org.gnome.Terminal.desktop' }}"

- name: Set default target to graphical
  ansible.builtin.command:
    cmd: systemctl set-default graphical.target
  changed_when: true

- name: Start graphical target
  ansible.builtin.systemd:
    name: graphical.target
    state: started
    no_block: true
  ignore_errors: true

- name: Configure GNOME settings via dconf load
  become: true
  become_user: "{{ bastion_desktop_user }}"
  ansible.builtin.shell:
    cmd: |
      PROFILE_UUID=$(cat /proc/sys/kernel/random/uuid | tr -d '-' | head -c 32)
      cat <<DCONF | dbus-run-session dconf load / 2>/dev/null || dconf load / 2>/dev/null
      [org/gnome/shell]
      favorite-apps=['{{ _term_app }}', '{{ bastion_desktop_favorite_apps | join("', '") }}']

      [org/gnome/desktop/interface]
      overlay-scrolling=false
      color-scheme='prefer-dark'
      gtk-theme='Adwaita-dark'

      [org/gnome/desktop/screensaver]
      lock-enabled=false

      [org/gnome/desktop/session]
      idle-delay=uint32 0

      [org/gnome/settings-daemon/plugins/power]
      sleep-inactive-ac-type='nothing'
      idle-dim=false

      [org/gnome/mutter]
      dynamic-workspaces=false

      [org/gnome/desktop/wm/preferences]
      num-workspaces=1
      button-layout='appmenu:minimize,maximize,close'

      [org/gnome/shell/extensions/dash-to-dock]
      dock-fixed=false
      autohide=true
      intellihide=true
      show-trash=false
      show-mounts=false

      {% if 'ptyxis' in ansible_facts.packages and bastion_desktop_ptyxis_palette | length > 0 %}
      [org/gnome/Ptyxis]
      default-profile-uuid='${PROFILE_UUID}'
      profile-uuids=['${PROFILE_UUID}']

      [org/gnome/Ptyxis/Profiles/${PROFILE_UUID}]
      palette='{{ bastion_desktop_ptyxis_palette }}'
      {% endif %}
      DCONF

      dbus-run-session gnome-extensions enable dash-to-dock@micxgx.gmail.com 2>/dev/null || true
  changed_when: true
  ignore_errors: true

- name: Set monitor resolution
  ansible.builtin.copy:
    content: |
      <monitors version="2">
        <configuration>
          <logicalmonitor>
            <x>0</x><y>0</y>
            <scale>1</scale>
            <primary>yes</primary>
            <monitor>
              <monitorspec>
                <connector>Virtual-1</connector>
                <vendor>unknown</vendor>
                <product>unknown</product>
                <serial>unknown</serial>
              </monitorspec>
              <mode>
                <width>{{ bastion_desktop_resolution_width }}</width>
                <height>{{ bastion_desktop_resolution_height }}</height>
                <rate>60</rate>
              </mode>
            </monitor>
          </logicalmonitor>
        </configuration>
      </monitors>
    dest: "{{ item.path }}/.config/monitors.xml"
    owner: "{{ item.owner }}"
    mode: "0644"
  loop:
    - { path: "/home/{{ bastion_desktop_user }}", owner: "{{ bastion_desktop_user }}" }
    - { path: /root, owner: root }

- name: Set GDM monitor resolution
  ansible.builtin.copy:
    content: |
      <monitors version="2">
        <configuration>
          <logicalmonitor>
            <x>0</x><y>0</y>
            <scale>1</scale>
            <primary>yes</primary>
            <monitor>
              <monitorspec>
                <connector>Virtual-1</connector>
                <vendor>unknown</vendor>
                <product>unknown</product>
                <serial>unknown</serial>
              </monitorspec>
              <mode>
                <width>{{ bastion_desktop_resolution_width }}</width>
                <height>{{ bastion_desktop_resolution_height }}</height>
                <rate>60</rate>
              </mode>
            </monitor>
          </logicalmonitor>
        </configuration>
      </monitors>
    dest: /var/lib/gdm/.config/monitors.xml
    owner: gdm
    mode: "0644"
  ignore_errors: true

- name: Configure auto-login
  when: bastion_desktop_auto_login
  block:
    - name: Enable auto-login in GDM
      ansible.builtin.lineinfile:
        path: /etc/gdm/custom.conf
        insertafter: '^\[daemon\]'
        line: "{{ item }}"
      loop:
        - "AutomaticLoginEnable=True"
        - "AutomaticLogin={{ bastion_desktop_user }}"

- name: Restart GDM to apply settings
  ansible.builtin.systemd:
    name: gdm
    state: restarted
    daemon_reload: true
  ignore_errors: true
