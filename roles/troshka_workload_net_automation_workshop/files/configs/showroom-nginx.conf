events {}
error_log /dev/stdout info;
http {
  include /etc/nginx/mime.types;
  proxy_cache off;
  expires -1;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Showroom and AAP both use /assets/ — route by referer
  map $http_referer $aap_assets {
    default 0;
    ~*/aap/ 1;
  }

  server {
    listen 80;
    absolute_redirect off;

    location / {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vscode/ {
      proxy_pass http://10.0.0.20:8080/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /aap/ {
      proxy_pass https://10.0.0.10:443/;
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_ssl_name aap.example.org;
      proxy_set_header Host aap.example.org;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Accept-Encoding "";
      proxy_redirect https://aap.example.org/ /aap/;
      proxy_redirect http://aap.example.org/ /aap/;
      sub_filter_types text/html text/css application/javascript text/javascript application/json;
      sub_filter_once off;
      sub_filter 'href="/' 'href="/aap/';
      sub_filter 'src="/' 'src="/aap/';
      sub_filter 'action="/' 'action="/aap/';
      sub_filter '": "///' '": "/aap/';
      sub_filter "'///" "'/aap/";
      sub_filter '"/assets/' '"/aap/assets/';
      sub_filter "'/assets/" "'/aap/assets/";
    }

    # /assets/ is shared: Showroom (default) vs AAP (when referer is /aap/)
    location /assets/ {
      error_page 418 = @aap_assets;
      if ($aap_assets = 1) { return 418; }
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @aap_assets {
      proxy_pass https://10.0.0.10:443$request_uri;
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_ssl_name aap.example.org;
      proxy_set_header Host aap.example.org;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /runner/ {
      proxy_pass https://10.0.0.10:443/runner/;
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_ssl_name aap.example.org;
      proxy_set_header Host aap.example.org;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /locales/ {
      proxy_pass https://10.0.0.10:443/locales/;
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_ssl_name aap.example.org;
      proxy_set_header Host aap.example.org;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /_ui/ {
      proxy_pass https://10.0.0.10:443/_ui/;
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_ssl_name aap.example.org;
      proxy_set_header Host aap.example.org;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /login {
      proxy_pass https://10.0.0.10:443/login;
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_ssl_name aap.example.org;
      proxy_set_header Host aap.example.org;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # AAP API + websocket
    location /api/ {
      proxy_pass https://10.0.0.10:443/api/;
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_ssl_name aap.example.org;
      proxy_set_header Host aap.example.org;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /websocket/ {
      proxy_pass https://10.0.0.10:443/websocket/;
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_ssl_name aap.example.org;
      proxy_set_header Host aap.example.org;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400;
    }

    location ^~ /wetty_control {
      proxy_pass http://127.0.0.1:8001/wetty_control;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 43200000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /wetty_vscode {
      proxy_pass http://127.0.0.1:8002/wetty_vscode;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 43200000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
