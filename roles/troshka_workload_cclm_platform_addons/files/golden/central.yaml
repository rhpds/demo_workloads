apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
spec:
  central:
    db:
      isEnabled: Default
      persistence:
        persistentVolumeClaim:
          claimName: central-db
          size: 100Gi
          storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        limits:
          cpu: 2
          memory: 4Gi
        requests:
          cpu: 500m
          memory: 1Gi
    exposure:
      route:
        enabled: true
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
  scanner:
    analyzer:
      resources:
        limits:
          cpu: 1
          memory: 2500Mi
        requests:
          cpu: 200m
          memory: 500Mi
      scaling:
        autoScaling: Disabled
        replicas: 1
    db:
      resources:
        limits:
          cpu: 1
          memory: 2500Mi
        requests:
          cpu: 200m
          memory: 512Mi
    scannerComponent: Disabled
  scannerV4:
    db:
      persistence:
        persistentVolumeClaim:
          claimName: scanner-v4-db
          size: 50Gi
          storageClassName: ocs-storagecluster-ceph-rbd
      resources:
        limits:
          cpu: 1
          memory: 2500Mi
        requests:
          cpu: 200m
          memory: 512Mi
    indexer:
      resources:
        limits:
          cpu: 1
          memory: 2500Mi
        requests:
          cpu: 200m
          memory: 500Mi
      scaling:
        autoScaling: Disabled
        replicas: 1
    matcher:
      resources:
        limits:
          cpu: 1
          memory: 2500Mi
        requests:
          cpu: 200m
          memory: 500Mi
      scaling:
        autoScaling: Disabled
        replicas: 1
    scannerComponent: Enabled
